version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
  - package-ecosystem: docker
    directory: /
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    schedule:
      interval: weekly
      day: sunday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
