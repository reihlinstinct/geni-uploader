name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly full suite: Sunday 06:00 Israel winter time (04:00 UTC;
    # runs 07:00 IDT in summer).
    - cron: '0 4 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Docs-only pull requests skip the heavy jobs; the Run summary gate
          # still runs and reports them as skipped.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a code-to-doc rename still shows the deleted code
          # path, so it cannot masquerade as docs-only.
          git diff --no-renames --name-only "origin/${BASE_REF}...HEAD" | tee /tmp/changed.txt
          # Doc-only allowlist: markdown/rst, license, and exact community
          # metadata names (no prefix matches) - unknown files run the suite.
          # Images always run: docs/ images are app assets.
          if grep -qvEi '\.(md|markdown|rst)$|^LICENSE$|^\.github/(CODEOWNERS|dependabot\.yml|FUNDING\.yml)$|^\.github/ISSUE_TEMPLATE/[^/]+\.(md|yml|yaml)$|^\.github/PULL_REQUEST_TEMPLATE(\.md)?$|^\.github/PULL_REQUEST_TEMPLATE/[^/]+\.md$' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: python -m pytest tests/ -v --junitxml=junit.xml
      - name: Per-test report
        if: always()
        run: python .github/test_summary.py junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload junit on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Production-only statement coverage (#98). Measure-only by default; the
    # per-file floor in .github/coverage-floor.txt blocks only when the repo
    # variable COVERAGE_GATE is "on".
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Measure production coverage
        run: |
          python -m coverage run --include=geni_upload.py,source_details.py -m pytest tests/ -q
          python -m coverage json -o coverage.json
          python -m coverage report -m
      - name: Coverage summary
        run: python .github/coverage_report.py coverage.json --floor "$(cat .github/coverage-floor.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Per-file floor gate (enabled when repo variable COVERAGE_GATE=on)
        if: vars.COVERAGE_GATE == 'on'
        run: python .github/coverage_report.py coverage.json --floor "$(cat .github/coverage-floor.txt)" --fail-under

  docker:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # PR-time image build + offline smoke (#606). Not pushed; no secrets.
    # Weekly cadence comes free via the existing schedule trigger.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run the test suite inside the image build
        # Dockerfile.test's final RUN is the suite; a red test fails the build.
        run: docker build -f Dockerfile.test .
      - name: Build the image (not pushed)
        run: docker build --pull -t geni-uploader:ci .
      - name: Baked files are byte-identical to the repo files
        run: |
          set -euo pipefail
          for f in geni_upload.py cli_spec.py source_details.py plan_report.py visual_plan.py; do
            BAKED="$(docker run --rm --entrypoint sha256sum geni-uploader:ci "/opt/$f" | cut -d' ' -f1)"
            REPO="$(sha256sum "$f" | cut -d' ' -f1)"
            echo "$f baked=$BAKED repo=$REPO"
            [ "$BAKED" = "$REPO" ]
          done
      - name: Smoke test (offline, no credentials)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python geni-uploader:ci -c "import yaml; print('pyyaml ok')"
          OUT="$(docker run --rm geni-uploader:ci 2>&1 || true)"
          echo "$OUT"
          echo "$OUT" | grep -q 'error: set GENI_UPLOAD_REPO'

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [changes, test, coverage, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
