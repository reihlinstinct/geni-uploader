name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: python -m pytest tests/ -v --junitxml=junit.xml
      - name: Per-test report
        if: always()
        run: python .github/test_summary.py junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload junit on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  coverage:
    # Production-only statement coverage (#98). Measure-only by default; the
    # per-file floor in .github/coverage-floor.txt blocks only when the repo
    # variable COVERAGE_GATE is "on".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Measure production coverage
        run: |
          python -m coverage run --include=geni_upload.py,source_details.py -m pytest tests/ -q
          python -m coverage json -o coverage.json
          python -m coverage report -m
      - name: Coverage summary
        run: python .github/coverage_report.py coverage.json --floor "$(cat .github/coverage-floor.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Per-file floor gate (enabled when repo variable COVERAGE_GATE=on)
        if: vars.COVERAGE_GATE == 'on'
        run: python .github/coverage_report.py coverage.json --floor "$(cat .github/coverage-floor.txt)" --fail-under
