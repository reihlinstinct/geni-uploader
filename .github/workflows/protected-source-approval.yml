name: Geni protected - source approval
run-name: 'protected-sources:${{ inputs.mode }}:${{ inputs.config_sha256 }}:${{ inputs.executor_sha }}:${{ inputs.plan_run_id }}'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Separate plan or upload; each needs human deployment approval
        required: true
        type: choice
        options: [plan, run]
      executor_sha:
        description: Exact reviewed executor commit matching master
        required: true
        type: string
      config_sha256:
        description: Approved private source package SHA256, no identifying values
        required: true
        type: string
      plan_run_id:
        description: Required successful same-package plan run ID for upload; empty for plan
        required: false
        type: string
      confirm:
        description: PLAN_SOURCES for plan, UPLOAD_SOURCES for upload
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: geni-upload
  cancel-in-progress: false
jobs:
  source:
    if: ${{ github.repository == 'reihlinstinct/geni-uploader' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.sha == inputs.executor_sha && github.actor == 'reihlinstinct' && github.triggering_actor == 'reihlinstinct' && github.run_attempt == 1 && ((inputs.mode == 'plan' && inputs.confirm == 'PLAN_SOURCES' && inputs.plan_run_id == '') || (inputs.mode == 'run' && inputs.confirm == 'UPLOAD_SOURCES' && inputs.plan_run_id != '')) }}
    environment: father-create
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install reviewed age release
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/age.tgz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - name: Exact reviewed protected source operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_MODE: ${{ inputs.mode }}
          SOURCE_EXECUTOR_SHA: ${{ inputs.executor_sha }}
          SOURCE_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          SOURCE_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_CONFIRM: ${{ inputs.confirm }}
          SOURCE_PACKAGE_JSON: ${{ secrets.PROTECTED_SOURCE_PACKAGE_JSON }}
          SOURCE_TREE_PAT: ${{ secrets.FAMILY_TREE_PAT }}
          GENI_ACCESS_TOKEN: ${{ secrets.GENI_ACCESS_TOKEN }}
          SOURCE_TEMP: ${{ runner.temp }}/protected-source
        run: |
          set +x
          umask 077
          PYTHONPATH=src python3 -m geni_uploader.runners.protected_source_approval
      - name: Preserve encrypted source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: protected-source-evidence
          path: ${{ runner.temp }}/protected-source/encrypted/*.age
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove temporary plaintext
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/protected-source/raw.log" "$RUNNER_TEMP/protected-source/tree-token" "$RUNNER_TEMP/protected-source/geni-token"
          rm -rf -- "$RUNNER_TEMP/protected-source/plan"
