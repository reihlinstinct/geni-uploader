name: Token context test (read-only, manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type TEST to make one read-only token-context request; no owner verification'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dedicated-token-context-test
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ github.repository == 'reihlinstinct/geni-uploader' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.actor == 'reihl' && github.triggering_actor == 'reihl' && inputs.confirm == 'TEST' }}
    environment: token-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One read-only request; fixed output only
        env:
          TOKEN_PROBE_CREDENTIAL: ${{ secrets.TOKEN_PROBE_CREDENTIAL }}
        run: python3 -I tools/token-probe/check.py

  summary:
    name: Run summary
    if: always()
    needs: [probe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
