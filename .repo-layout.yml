{
  "version": 1,
  "comment": "Repo layout contract, enforced by tools/check_repo_layout.py (issue #721). JSON syntax: valid YAML too, parses with the Python standard library. required: paths that must exist (trailing slash = directory). root: files at the repository root must match allow and never match deny. directories: every tracked top-level directory must be listed; files under it (any depth) must match one allow pattern (matched against the basename).",
  "required": [
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "ACCESSIBILITY.md",
    "SUPPORT.md",
    ".github/CODEOWNERS",
    ".github/ISSUE_TEMPLATE/",
    ".github/pull_request_template.md"
  ],
  "root": {
    "allow": [
      "*.md",
      ".gitignore",
      ".repo-layout.yml",
      "LICENSE*",
      "Dockerfile",
      "Dockerfile.*",
      "entrypoint.sh",
      "pyproject.toml",
      "requirements*.txt"
    ],
    "deny": ["*.py"]
  },
  "directories": {
    ".github": {"allow": ["CODEOWNERS", "*.yml", "*.yaml", "*.md", "*.py", "*.json", "*.txt"]},
    "docs": {"allow": ["*.md", "*.html", "*.json", "*.yml", "*.yaml", "*.example"]},
    "geni_offline": {"allow": ["*.py"]},
    "man": {"allow": ["*.1"]},
    "oauth-bootstrap": {"allow": ["*.mjs", "*.json", "*.jsonc", "*.md", ".gitignore"]},
    "scripts": {"allow": ["*.py", "*.sh"]},
    "src": {"allow": ["*.py", "*.json"]},
    "tests": {"allow": ["*.py", "*.json"]},
    "tools": {"allow": ["*.py", "*.sh"]}
  }
}
